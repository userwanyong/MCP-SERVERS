juejin:
  api:
    categories:
    cookie:
    authorization:

spring:
  application:
    name: mcp-server-juejin

  ai:
    mcp:
      server:
        name: ${spring.application.name}
        version: 1.0.0
        type: SYNC # 同步
        sse-message-endpoint: /mcp/message  # SSE 消息端点路径
        sse-endpoint: /sse                  # SSE 端点路径

  main:
    banner-mode: off

logging:
  file:
    name: data/mcp-log/${spring.application.name}.log

server:
  port: 9003



